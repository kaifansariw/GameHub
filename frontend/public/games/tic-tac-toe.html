<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - GameHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.24/dist/full.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="common-game.css">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #7c3aed, #ec4899);
      --bg-dark: transparent;
      --card-bg: rgba(255, 255, 255, 0.05);
    }

    body {
      background: var(--bg-deep);
      /* from common-game.css */
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      /* from common-game.css */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .game-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 15px;
    }

    .game-container {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.2);
      backdrop-filter: blur(10px);
    }

    .cell {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 90px;
      height: 90px;
      font-size: 2rem;
    }

    .cell:not(:disabled):hover {
      background: rgba(124, 58, 237, 0.1);
      border-color: #7c3aed;
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
    }

    .cell:not(:disabled):active {
      transform: scale(0.98);
    }

    .stat {
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .rules-section {
      padding: 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      max-width: 500px;
    }

    .compact-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .glow-text {
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 0 10px rgba(124, 58, 237, 0.5);
      color: white;
    }

    @media (min-width: 640px) {
      .cell {
        width: 100px;
        height: 100px;
        font-size: 2.25rem;
        border-radius: 14px;
      }
    }

    @media (min-width: 1024px) {
      .cell {
        width: 108px;
        height: 108px;
        font-size: 2.5rem;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body class="min-h-screen">
  <div class="bg-glow"></div>
  <div id="root"></div>

  <!-- React, ReactDOM, and Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../scripts/score-saver.js"></script>
  <script type="text/babel" src="../scripts/tic-tac-toe.js"></script>
</body>

</html>
