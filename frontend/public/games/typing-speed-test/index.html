<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Typing Sprint - GameHub</title>

  <link rel="stylesheet" href="../common-game.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="game-wrapper">
  <div class="bg-glow"></div>

  <header class="topbar">
    <h1 class="logo">
      TYPING <span>SPRINT</span>
    </h1>

    <select id="mode">
      <option value="normal">FREE RUN</option>
      <option value="timed-30">TIMED — 30S</option>
      <option value="timed-60">TIMED — 60S</option>
    </select>
  </header>

  <main class="container">
    <section class="test-area">

      <div class="stage-header">
        <div id="sessionStatus" class="session-status">
          Ready. Press Engage to begin.
        </div>
      </div>

      <div id="box" class="box" aria-live="polite">
        Paste custom text below and press Engage.
      </div>

      <div class="input-row">
        <input
          id="input"
          type="text"
          placeholder="Start typing here..."
          autocomplete="off"
        />
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">TIME</span>
          <div id="time" class="metric-value">0S</div>
        </div>

        <div class="metric-card">
          <span class="metric-label">THROUGHPUT</span>
          <div id="wpm" class="metric-value">—</div>
        </div>

        <div class="metric-card">
          <span class="metric-label">PRECISION</span>
          <div id="accuracy" class="metric-value">—</div>
        </div>
      </div>

      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="controls-panel">

        <textarea
          id="customText"
          placeholder="Inject custom linguistic data..."
          rows="2"
        ></textarea>

        <div class="controls-actions">
          <button id="start">Engage</button>
          <button id="restart">Reset</button>
        </div>

      </div>

      <div class="extras">
        <label>
          <input type="checkbox" id="soundToggle" checked />
          ACOUSTICS
        </label>

        <label>
          <input type="checkbox" id="highlightWords" checked />
          DATA FOCUS
        </label>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
