{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback - GameHub</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="{% static 'style.css' %}">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* Glass card */

.feedback-card{
width:650px;
padding:50px;
background:rgba(255,255,255,0.08);
border-radius:20px;
backdrop-filter:blur(18px);
box-shadow:0 20px 40px rgba(0,0,0,0.4);
animation:fadeUp .8s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

/* Title */

.feedback-title{
font-size:38px;
text-align:center;
margin-bottom:35px;
color:white;
font-family:'Orbitron',sans-serif;
font-weight:700;
letter-spacing:1px;
}

/* Inputs */

.feedback-input{
width:100%;
padding:15px 18px;
margin-bottom:20px;

border-radius:12px;
border:none;
outline:none;

font-family:'Rajdhani',sans-serif;
font-weight:500;
font-size:17px;

background:rgba(255,255,255,0.95);
color:#111;

transition:.3s;
}

.feedback-input::placeholder{
color:#6b7280;
}

.feedback-input::placeholder{
color:#6b7280;
font-weight:500;
letter-spacing:.3px;
}

.feedback-input:focus{
box-shadow:0 0 15px #a855f7;
background:white;
}

/* Textarea */

textarea.feedback-input{
height:140px;
resize:none;
}

/* Button */

.feedback-btn{

width:100%;
padding:16px;

border:none;
border-radius:12px;

font-family:'Rajdhani',sans-serif;
font-weight:700;
font-size:18px;

letter-spacing:.6px;

color:white;

background:linear-gradient(90deg,#9333ea,#ec4899);

cursor:pointer;

transition:.3s;

}

.feedback-btn:hover{
transform:scale(1.05);
box-shadow:0 0 25px #a855f7;
}

/* Error box */

.error{
margin-top:15px;
background:rgba(255,80,80,0.15);
border:1px solid rgba(255,80,80,0.4);
padding:10px 15px;
border-radius:8px;
color:#ff6b6b;
font-weight:600;
text-align:center;
animation:shake .4s ease;
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-5px)}
50%{transform:translateX(5px)}
75%{transform:translateX(-5px)}
100%{transform:translateX(0)}
}

/* Success popup */

.success-popup{
position:fixed;
top:30px;
right:30px;
display:flex;
align-items:center;
gap:12px;
background:#0f0f0f;
padding:15px 25px;
border-radius:12px;
color:white;
box-shadow:0 10px 25px rgba(0,0,0,0.5);
animation:popupSlide .5s ease;
font-family:'Rajdhani',sans-serif;
}

.success-icon{
font-size:22px;
}

.success-text{
font-size:16px;
}

@keyframes popupSlide{
from{
opacity:0;
transform:translateY(-20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body class="overflow-x-hidden">

<!-- SAME BACKGROUND AS HOMEPAGE -->

<div class="fixed inset-0 z-0">

<div class="absolute inset-0 bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900"></div>

<div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg width=\"60\" height=\"60\" viewBox=\"0 0 60 60\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cg fill=\"%239C92AC\" fill-opacity=\"0.08\"%3E%3Ccircle cx=\"30\" cy=\"30\" r=\"2\"/%3E%3C/g%3E%3C/svg%3E')]"></div>

</div>

<div class="min-h-screen flex items-center justify-center relative z-10">

<div class="feedback-card">

<h2 class="feedback-title">Send Feedback</h2>

<form id="feedbackForm">

<input
type="text"
id="name"
placeholder="Your Name"
class="feedback-input"
/>

<input
type="email"
id="email"
placeholder="Your Email"
class="feedback-input"
/>

<textarea
id="message"
placeholder="Your Message"
class="feedback-input"
></textarea>

<button
type="submit"
class="feedback-btn">
Submit Feedback
</button>

<p id="error" style="display:none"></p>

</form>

</div>

</div>

<script>

const form=document.getElementById("feedbackForm")
const error=document.getElementById("error")

form.addEventListener("submit",function(e){

e.preventDefault()

const name=document.getElementById("name").value.trim()
const email=document.getElementById("email").value.trim()
const message=document.getElementById("message").value.trim()

if(!name||!email||!message){

error.style.display="block"
error.className="error"
error.innerHTML="⚠ Please fill all fields before submitting."

return
}

error.style.display="none"

const popup=document.createElement("div")

popup.className="success-popup"

popup.innerHTML=`
<div class="success-icon">🎉</div>
<div class="success-text">
Thank you <b>${name}</b> for your feedback!
</div>
`

document.body.appendChild(popup)

setTimeout(()=>{
popup.remove()
},3500)

form.reset()

})

</script>

</body>
</html>
